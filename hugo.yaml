baseURL: https://fabiolopes.page/
title: Fabio Lopes
copyright: Fabio M. Lopes
defaultContentLanguage: en
enableEmoji: true
enableRobotsTXT: true
timeZone: UTC

module:
  imports:
    - path: github.com/CaiJimmy/hugo-theme-stack/v4

languages:
  en:
    locale: en-US
    label: English
    weight: 1
    params:
      description: Notes and practical work in cloud infrastructure, platform engineering and reliability by Fabio Lopes.
      sidebar:
        subtitle: Cloud · Platforms · Reliability
  pt-br:
    locale: pt-BR
    label: Português
    weight: 2
    params:
      description: Experiências e projetos de Fabio Lopes em infraestrutura cloud, engenharia de plataformas e confiabilidade.
      sidebar:
        subtitle: Cloud · Plataformas · Confiabilidade

services:
  disqus:
    shortname: fabiomlopes
  googleAnalytics:
    id: G-855J736ZLY

pagination:
  pagerSize: 3
permalinks:
  post: /p/:slug/
  page: /:slug/
sitemap:
  filename: sitemap.xml

params:
  mainSections: [post]
  rssFullContent: true
  favicon: img/favicon.png
  author: Fabio M. Lopes
  footer:
    since: 2020
  dateFormat:
    published: ':date_medium'
    lastUpdated: ':date_medium'
  sidebar:
    avatar: img/avatar.png
  article:
    headingAnchor: true
    toc: true
    readingTime: true
    math: false
    license:
      enabled: false
  comments:
    enabled: true
    provider: disqus
  cookies:
    enabled: true
    showSettings: true
    categories:
      analytics: true
      functional: true
  widgets:
    homepage: []
    page:
      - type: toc
  colorScheme:
    toggle: true
    default: auto
  imageProcessing:
    autoOrient: true
    thumbnail:
      enabled: true
    content:
      enabled: true
      widths: [800, 1600]

menu:
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/biofalopes
      params:
        icon: brand-github
    - identifier: linkedin
      name: LinkedIn
      url: https://linkedin.com/in/fabiomlopes
      params:
        icon: brand-linkedin
    - identifier: email
      name: Email
      url: mailto:fabioctba01@gmail.com
      params:
        icon: mail

related:
  includeNewer: true
  threshold: 60
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: false
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
