# Historical reference: grafana/loki chart 6.24.0 (Loki 3.3.2).
# Rendered locally; adapt endpoint, Secret, PVCs and authentication before use.
deploymentMode: Distributed
global:
  clusterDomain: cluster.local
  dnsService: kube-dns
  dnsNamespace: kube-system
loki:
  auth_enabled: true
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: https://s3.example.com
      region: us-east-1
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: false
ingester:
  replicas: 3
  zoneAwareReplication:
    enabled: false
  persistence:
    enabled: true
    claims:
      - name: data
        size: 10Gi
        storageClass: rook-ceph-block
  extraArgs: &expandEnv
    - -config.expand-env=true
  extraEnvFrom: &storageEnv
    - secretRef:
        name: loki-s3
querier:
  replicas: 2
  maxUnavailable: 1
  extraArgs: *expandEnv
  extraEnvFrom: *storageEnv
queryFrontend:
  replicas: 2
  maxUnavailable: 1
  extraArgs: *expandEnv
  extraEnvFrom: *storageEnv
queryScheduler:
  replicas: 2
  extraArgs: *expandEnv
  extraEnvFrom: *storageEnv
distributor:
  replicas: 2
  maxUnavailable: 1
  extraArgs: *expandEnv
  extraEnvFrom: *storageEnv
compactor:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: rook-ceph-block
  extraArgs: *expandEnv
  extraEnvFrom: *storageEnv
indexGateway:
  replicas: 2
  maxUnavailable: 1
  extraArgs: *expandEnv
  extraEnvFrom: *storageEnv
gateway:
  replicas: 2
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
singleBinary:
  replicas: 0
minio:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
