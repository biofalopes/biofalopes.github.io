php2shell-aws-incident-response-lessons:
  en:
    problem: A critical PHP advisory affected a portfolio of applications with different EC2 and ECS deployment models.
    contribution: I supported discovery and runtime investigation, working with application owners on containment and remediation.
    decision: Treat image rebuilds, instance replacement and temporary access restrictions as distinct response paths.
    outcome: Updated versions were checked on reviewed EC2 instances and container remediation was coordinated. A reproducible AMI and bootstrap redesign remains follow-up work.
terraform-3:
  en:
    problem: Infrastructure changes can conflict with application releases and resources owned by other teams.
    contribution: I examine the ownership boundaries in our multi-account AWS platform.
    decision: Separate infrastructure management from application delivery and reference externally owned resources.
    outcome: An architectural direction to validate through operational changes; implementation results are still pending.
  pt-br:
    problem: Mudanças de infraestrutura podem conflitar com entregas de aplicações e recursos de outras equipes.
    contribution: Analiso os limites de responsabilidade na nossa plataforma AWS com múltiplas contas.
    decision: Separar a gestão da infraestrutura da entrega de aplicações e referenciar recursos de outras equipes.
    outcome: Uma direção arquitetural a validar em mudanças operacionais; os resultados de implementação ainda estão pendentes.
jupyter-forecast:
  en:
    problem: The team urgently needed Ceph growth projections to support hardware acquisition across sites and device classes.
    contribution: I built the Python integration from a Jupyter Notebook into scheduled Mimir collection, charts and Teams reporting, using forecasting logic provided by a colleague.
    decision: Deliver a simple, understandable projection and automate the reporting workflow before pursuing more sophisticated models.
    outcome: Scheduled charts and summaries supported the team's capacity-planning work. The article preserves the implementation delivered at the time, with later improvements identified separately.
  pt-br:
    problem: A equipe precisava com urgência de projeções de crescimento Ceph para apoiar a aquisição de hardware por site e classe de dispositivo.
    contribution: Desenvolvi a integração Python do Jupyter Notebook à coleta agendada no Mimir, aos gráficos e aos relatórios no Teams, usando a lógica de previsão fornecida por um colega.
    decision: Entregar uma projeção simples e compreensível e automatizar os relatórios antes de investir em modelos mais sofisticados.
    outcome: Gráficos e resumos agendados apoiaram o planejamento de capacidade da equipe. O artigo preserva a implementação entregue na época e identifica separadamente as melhorias futuras.
ibb-kids:
  en:
    problem: A community application must run within the cost and operational constraints of a single ARM host.
    contribution: I designed the architecture, release controls, backup workflow and production validation gates.
    decision: Use versioned releases, native ARM builds and SQLite-consistent backups copied to private object storage.
    outcome: An operating application with documented recovery procedures. Host failure and release interruptions remain explicit limits.
  pt-br:
    problem: Uma aplicação comunitária precisa funcionar dentro das restrições de custo e operação de um único host ARM.
    contribution: Projetei a arquitetura, os controles de entrega, o fluxo de backup e as verificações de produção.
    decision: Usar releases versionadas, builds nativos ARM e backups consistentes do SQLite em armazenamento privado.
    outcome: Uma aplicação em operação com procedimentos de recuperação documentados. Falhas do host e interrupções nas entregas continuam sendo limitações.
