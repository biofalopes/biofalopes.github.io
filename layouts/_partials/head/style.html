{{- $options := dict "targetPath" "css/style.css" "transpiler" "dartsass" "silenceDeprecations" (slice "import" "global-builtin" "color-functions") -}}
{{- $style := resources.Get "scss/style.scss" | css.Sass $options | minify | fingerprint "sha384" -}}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
